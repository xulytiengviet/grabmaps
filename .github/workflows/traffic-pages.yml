name: Deploy Traffic GIS to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "traffic/**"
      - ".github/workflows/traffic-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: traffic-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site/traffic
          cp traffic/index.html _site/traffic/index.html
          printf '<meta http-equiv="refresh" content="0;url=./traffic/">\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
